name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    # The full suite checks the supported Windows demo environment and the
    # installed public Core, in addition to portable application tests.
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"
      - name: Install Python test environment
        run: |
          python -m venv .venv
          ./.venv/Scripts/python.exe -m pip install -e ".[dev]" "psycopg[binary]>=3.2"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          (Resolve-Path .venv/Scripts).Path | Add-Content $env:GITHUB_PATH
      - name: Install workspace Node dependencies
        run: |
          corepack enable
          corepack prepare pnpm@9.15.0 --activate
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Initialize exact public Core and workspace rules
        run: ./scripts/initialize_cvf_clone.ps1
      - name: Install pinned public skill validator
        run: |
          $validatorRoot = Join-Path $env:RUNNER_TEMP 'cvf-skill-creator'
          $validatorDirectory = Join-Path $validatorRoot 'scripts'
          New-Item -ItemType Directory -Path $validatorDirectory -Force | Out-Null
          $validatorPath = Join-Path $validatorDirectory 'quick_validate.py'
          $source = 'https://raw.githubusercontent.com/openai/codex/d78f68f8d1016b2ffba14a91ccd33ef7fa527971/codex-rs/skills/src/assets/samples/skill-creator/scripts/quick_validate.py'
          Invoke-WebRequest -Uri $source -OutFile $validatorPath
          $expected = 'ee6dba90f44d37171c5a6edb8095979c54919ff6822c1a907afca2e78c48738c'
          if ((Get-FileHash $validatorPath -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) {
            throw 'Public skill validator SHA-256 mismatch'
          }
          "SKILL_CREATOR_ROOT=$validatorRoot" | Add-Content $env:GITHUB_ENV
      - name: Module catalog --check (structural source of truth must not drift)
        run: python scripts/generate_catalog.py --check
      - name: CVF catalog kit projection --check
        run: python scripts/sync_cvf_catalog_kit.py
      - name: Repository validation
        run: python scripts/testing/validate_repository.py
      - name: Prepare bounded Windows ACL dependencies
        run: |
          @'
          import subprocess
          import sys
          sys.path.insert(0, "scripts")
          from p5a2_source_demo_common import child_env
          command = "$ErrorActionPreference='Stop'; $null=Get-Command Get-Acl -ErrorAction Stop; Import-Module Microsoft.PowerShell.Security; $null=[Security.Principal.WindowsIdentity]::GetCurrent().User; $null=Get-Acl -LiteralPath $env:TEMP; 'ACL_DEPENDENCIES_READY'"
          result = subprocess.run(
              ["powershell", "-NoProfile", "-NonInteractive", "-Command", command],
              env=child_env(), capture_output=True, text=True, timeout=90,
          )
          if result.returncode or result.stdout.strip() != "ACL_DEPENDENCIES_READY":
              raise SystemExit("Windows ACL dependency preparation failed")
          print("Windows ACL dependencies ready")
          '@ | python -
      - name: Verify private ACL fixture on hosted Windows
        run: python -m pytest -q -s tests/unit/test_p5a2_demo_recovery_findings.py::test_explicit_everyone_read_grant_refuses_private_acl
      - name: Tests
        run: python -m pytest -q

  catalog-kit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Governed catalog kit --check
        shell: pwsh
        run: ./scripts/manage_cvf_downstream_catalog.ps1 -Check

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"
      - name: Enable Corepack
        run: corepack enable && corepack prepare pnpm@9.15.0 --activate
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm --filter workspace-web typecheck
      - name: Test
        run: pnpm --filter workspace-web test
      - name: Build
        run: pnpm --filter workspace-web build
